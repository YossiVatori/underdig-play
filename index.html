<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="UnderDig: drive a drill truck, dig deep, sell the ore. Plays in the browser on phone or computer.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>UnderDig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one full-screen Unity canvas inside the phone's safe area, with a loading plate on top. Single dark look, like the game's HUD. */
:root {
  --ground: #0b0d12;   /* deep tunnel black */
  --ink: #12151c;      /* HUD panel steel */
  --line: #313948;
  --text: #f3efe6;
  --muted: #9aa3b2;
  --hazard: #f2b705;   /* drill-truck yellow */
  --danger: #e04848;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font-family: var(--font-ui); overflow: hidden;
  touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); background: var(--ground); }
#unity-canvas { display: block; width: 100%; height: 100%; background: var(--ground); outline: none; touch-action: none; }
#splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.plate { width: min(320px, 100%); display: grid; gap: 14px; text-align: center; }
.logo { margin: 0; font: 400 clamp(40px, 13vw, 60px)/0.95 var(--font-display); color: var(--hazard);
  text-shadow: 0 4px 0 #6b4d00, 0 8px 24px #000; letter-spacing: .01em; }
.tag { margin: -4px 0 0; font: 600 16px var(--font-ui); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.bar { height: 12px; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--hazard); border-radius: 6px; transition: width .2s linear; }
#status { margin: 0; font: 600 15px/1.3 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
#error { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--ink); border: 1px solid var(--danger);
  color: var(--text); font: 600 15px/1.35 var(--font-ui); text-align: left; overflow-wrap: anywhere; }
#banner { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%);
  max-width: min(92vw, 480px); padding: 8px 14px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line);
  color: var(--text); font: 600 14px/1.3 var(--font-ui); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div id="stage"><canvas id="unity-canvas" tabindex="-1" aria-label="UnderDig game"></canvas></div>

<div id="splash">
  <div class="plate">
    <h1 class="logo">UNDER<br>DIG</h1>
    <p class="tag">Dig deep. Get rich.</p>
    <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
    <p id="status">Loading the drill truck…</p>
    <p id="error" hidden></p>
  </div>
</div>
<div id="banner" hidden></div>

<script src="Build/Web.loader.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const splash = $('splash'), fill = $('fill'), status = $('status'), error = $('error'), banner = $('banner');
  const bar = fill.parentElement;

  function fail(message) {
    status.textContent = "The game couldn't start.";
    error.textContent = String(message || 'Unknown error');
    error.hidden = false;
    splash.hidden = false;
  }
  window.addEventListener('error', e => { if (!splash.hidden) fail(e.message); });

  let bannerTimer = 0;
  function showBanner(message, type) {
    if (type === 'error') { fail(message); return; }
    banner.textContent = message; banner.hidden = false;
    clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { banner.hidden = true; }, 5000);
  }

  if (typeof createUnityInstance !== 'function') { fail('The game loader (Build/Web.loader.js) did not load.'); return; }

  const config = {
    arguments: [],
    // The host serves only standard web types, so the gzipped files carry .wasm names;
    // the loader recognises Unity's gzip marker and unpacks them itself.
    dataUrl: 'Build/Web.data.wasm',
    frameworkUrl: 'Build/Web.framework.js',
    codeUrl: 'Build/Web.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Yossi Vatori',
    productName: 'UnderDig',
    productVersion: '0.1.0',
    showBanner,
    // No devicePixelRatio override: Unity renders at the screen's own density (3x on iPhone) for a sharp picture.
    matchWebGLToCanvasSize: true,
    // Keeps the save file (dug tunnels, money, upgrades) between visits.
    autoSyncPersistentDataPath: true,
  };

  createUnityInstance($('unity-canvas'), config, p => {
    const pct = Math.round(p * 100);
    fill.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', String(pct));
    status.textContent = pct < 90 ? 'Loading the drill truck… ' + pct + '%' : 'Starting the engine…';
  }).then(() => {
    splash.hidden = true;
    $('unity-canvas').focus();
  }).catch(fail);
})();
</script>
